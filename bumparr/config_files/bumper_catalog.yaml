# Bumper Catalog
# Descriptive inventory of bumper concepts. Runtime must not parse this file
# to decide what to generate; SQLite playables remain authoritative.
#
# Variety comes from different production mechanisms, not just more clips.
# Each content row records how it would be produced and how ready it is.
#
# state (exactly one):
#   shipped   - documented, reachable, and tested
#   partial   - a mechanism exists but the named concept is incomplete
#   proposed  - no implementation
#   blocked   - a named dependency or rights decision prevents it
#   deferred  - deliberately outside near-term milestones
#
# mechanism: how it is / would be produced (generate, fetch, data-api, …).
# implementation: required for shipped/partial — module/route/test evidence.
# gap: required for proposed/blocked/deferred — what is missing, or why.
#
# treatment: a presentation wrapper over a base asset (not a content row).
# Seasonal/holiday modifiers are time-based weight overlays, not content.

treatments:
  - reveal-late        # hide the key detail (location/answer/meaning) until the final seconds
  - slow-zoom          # start extremely cropped, slowly widen to reveal
  - delayed-answer     # question/clue up, answer after a beat
  - progressive        # clues that get progressively easier

# Seasonal/holiday are NOT content types — they are time-based weight overlays.
modifiers:
  - name: Seasonal Flavor
    kind: seasonal
    notes: lightly boost spring rain/flowers, summer beaches, autumn leaves, winter snow in season
  - name: Holiday Flavor
    kind: holiday
    notes: temporary boosts - July 4 fireworks, Halloween weirdness, Christmas lights, NYE, Thanksgiving

# ---- LIVE STREAMS ("windows") -------------------------------------------------
streams:
  - name: Live Windows
    type: stream
    state: shipped
    mechanism: fetch
    treatment: []
    sources: [public-webcam-directories, youtube-live, dot-traffic-cams, windy-webcams]
    license: public-feeds-only
    implementation: "bumparr/live_cams.py, bumparr/config_files/live_cams.yaml, bumparr/sources/capture_windows.py, bumparr/stream_proxy.py; stream rows via /api/bumpers; tests/test_live_cams.py, tests/test_stream_proxy.py, tests/test_jobs.py"
    notes: "Open direct-HLS cams ship enabled. YouTube snapshot cams are opt-in and commented out (scrape policy is the operator's)."
  - name: Meanwhile
    type: stream
    state: partial
    mechanism: fetch
    treatment: [reveal-late]
    sources: [public-webcam-directories, youtube-live]
    license: public-feeds-only
    implementation: "Live-window mechanism in bumparr/live_cams.py and capture_windows.py; no late location-reveal treatment."
    notes: "Unexplained live cam; location revealed near the end. Windows exist; the reveal-late treatment does not."
  - name: Nature Roulette
    type: stream
    state: proposed
    mechanism: fetch
    treatment: []
    sources: [explore-org, youtube-live, zoo-aquarium-cams]
    license: public-feeds-only
    gap: "No dedicated nature-cam pool or rotation. live_cams.yaml only comments a bird-feeder snapshot example; do not treat a nearby window kind as this concept."
    notes: "bird feeders/nests/bears/aquariums/reefs/zoos"
  - name: Machine Cam
    type: stream
    state: proposed
    mechanism: fetch
    treatment: []
    sources: [youtube-live, public-webcam-directories, wikimedia]
    license: mixed
    gap: "No dedicated machine-cam ingest, kind, or tests."
    notes: "factories/CNC/3D printers/rail yards/ship locks/drawbridges/telescopes; mix of live + recorded"
  - name: Microscope
    type: video
    state: proposed
    mechanism: fetch
    treatment: []
    sources: [wikimedia, nih-bioimage, youtube-cc]
    license: cc
    gap: "No microscopy ingest or kind. ingest.py's science vibe maps to fun_animation search terms only."
    notes: "microscopy footage dropped in with little explanation"
  - name: Radio Scan
    type: stream
    state: proposed
    mechanism: fetch
    treatment: []
    sources: [public-radio-streams, radio-garden-public]
    license: public-streams-only
    gap: "No public-radio stream ingest, audio-snippet producer, or tests."
    notes: "legal live/public audio snippet + simple visual"

