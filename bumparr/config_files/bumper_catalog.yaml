    mechanism: generate
    implementation: "bumparr/station_ids.py; render_cards.py _frames_station_id; seed.py CATEGORY station_ids; tests/test_processes.py, tests/test_render_hardening.py"
    notes: "short brand idents; combinatorial stills/clips x font roulette"
  - name: Dead Air
    type: card
