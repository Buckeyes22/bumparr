    implementation: "bumparr/generators/grounded.py gen_trivia; POST /api/generate/trivia; card_validation trivia rules; tests/test_grounded.py, tests/test_card_validation.py"
    notes: "movie/tv/music/science/history/geography/tech/general. Grounded in Open Trivia DB, not model invention."
  - name: Fun Facts
    type: card
    state: shipped
    mechanism: data-api
    implementation: "bumparr/generators/grounded.py gen_fun_facts; POST /api/generate/fun_facts; docs/CARDS.md; tests/test_grounded.py, tests/test_card_validation.py"
    notes: "genuinely interesting short facts from Wikipedia"
  - name: Guess the Year
    type: card
    state: proposed
    mechanism: data-api
    treatment: [reveal-late]
    gap: "No guess_year generator or API route. render_cards.CARD_LABELS and enrich_bg.ELIGIBLE mention the kind; that is not an implementation."
    notes: "show object/photo/movie/tech, reveal its year"
  - name: Three Clues
