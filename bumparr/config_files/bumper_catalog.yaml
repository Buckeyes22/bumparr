    implementation: "ingest.py PROCEDURAL dead_air; render_cards.py _frames_dead_air; STANDBY_KINDS; docs/RENDERING.md; tests/test_grounded.py register_all_baselines"
    notes: "rare near-silent black bumper + tiny brand ident"
  - name: Local Time
    type: card
    state: partial
    mechanism: generate
    implementation: "render_cards.py _frames_local_time and VOLATILE_TTL; app._volatile_refresh_loop; docs/RENDERING.md; tests/test_render_hardening.py. No generator or baseline registers a local_time row."
    notes: "minimalist clock/date card as broadcast breathing room"
